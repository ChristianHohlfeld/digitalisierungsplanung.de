<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Intelligence</title>
  <style>
    :root { color-scheme: light; --bg:#f6f8fb; --text:#0f172a; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 28px)); padding: 28px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); line-height: 1.05; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
  </style>
  <script src="/assets/agent-widget.js" defer></script>
</head>
<body>
  <main>
    <h1>App Intelligence</h1>
    <p>State-Blueprints erstellen, prüfen, exportieren und laden.</p>
  </main>
  <dp-agent-widget data-open="true"></dp-agent-widget>
</body>
</html>
