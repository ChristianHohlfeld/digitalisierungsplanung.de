name: Finalize external recorder

on:
  push:
    branches:
      - feature/external-url-recorder

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Normalize recorder architecture
        run: |
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil, subprocess

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing marker for {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          # Recorder belongs in the editor itself, never in service-worker cleanup glue.
          main_disable = subprocess.check_output(["git", "show", "origin/main:disable-sw.js"], text=True)
          Path("disable-sw.js").write_text(main_disable)

          replace_once(
              "state.html",
              '    <button id="btnLoad">Laden</button>\n    <button id="btnExport">HTML exportieren</button>',
              '    <button id="btnLoad">Laden</button>\n    <button id="btnRecordUrl" title="Beliebige öffentliche Website aufnehmen">URL aufnehmen</button>\n    <button id="btnExport">HTML exportieren</button>',
              "desktop recorder button"
          )
          replace_once(
              "state.html",
              '        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnLoad">Laden</button>\n        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnExport">HTML exportieren</button>',
              '        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnLoad">Laden</button>\n        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnRecordUrl">URL aufnehmen</button>\n        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnExport">HTML exportieren</button>',
              "mobile recorder button"
          )
          replace_once(
              "state.html",
              '    document.getElementById("btnLoad").onclick = requestLoadBlueprintFile;\n    document.getElementById("btnExport").onclick = exportHtmlFile;',
              '    document.getElementById("btnLoad").onclick = requestLoadBlueprintFile;\n    document.getElementById("btnRecordUrl").onclick = () => { location.href = "/recorder.html"; };\n    document.getElementById("btnExport").onclick = exportHtmlFile;',
              "recorder button binding"
          )

          # Static recorder.html is the single UI; browser service exposes only the API.
          p = Path("server/external-recorder.js")
          src = p.read_text()
          src = src.replace('const RECORDER_PAGE_PATH = "/recorder.html";\n', '')
          src = re.sub(r'const ALLOWED_POPUP_TARGET_ORIGINS = new Set\(\[.*?\]\);\n\n', '', src, flags=re.S)
          src = re.sub(r'function writeHtml\(response, statusCode, body\) \{.*?\n\}\n\nasync function readJsonBody', 'async function readJsonBody', src, flags=re.S)
          src = re.sub(r'function recorderHtml\(\) \{.*?\n\}\n\nfunction matchesRecorderPath', 'function matchesRecorderPath', src, flags=re.S)
          src = src.replace('  return pathname === RECORDER_PAGE_PATH || pathname === RECORDER_API_PREFIX || pathname.startsWith(`${RECORDER_API_PREFIX}/`);', '  return pathname === RECORDER_API_PREFIX || pathname.startsWith(`${RECORDER_API_PREFIX}/`);')
          src = re.sub(r'    if \(request\.method === "GET" && url\.pathname === RECORDER_PAGE_PATH\) \{\n      writeHtml\(response, 200, recorderHtml\(\)\);\n      return;\n    \}\n', '', src)
          src = src.replace('  RECORDER_PAGE_PATH,\n', '')
          src = src.replace('  recorderHtml,\n', '')
          src = src.replace('  ALLOWED_POPUP_TARGET_ORIGINS\n', '')
          src = src.replace('  handleRecorderRequest,\n};', '  handleRecorderRequest\n};')
          p.write_text(src)

          # Playwright is a declared production dependency; deploy only installs its pinned browser.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package.setdefault("dependencies", {})["playwright"] = "1.60.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          deploy_path = Path("server/deploy.sh")
          deploy = deploy_path.read_text()
          deploy = deploy.replace('retry 3 5 npm install --no-save --package-lock=false --omit=dev playwright@1.60.0\n', '')
          deploy_path.write_text(deploy)

          # Normative contract: transient authoring session in, canonical FSM out.
          replace_once(
              "docs/state-contract.md",
              '- Reset oder neues Modell verwirft die Aufnahme. Standalone-Export und Preview\n  verwenden dieselbe Recorder-Logik.\n- Der Export enthält JSON vollständig self-contained und optional einen',
              '- Reset oder neues Modell verwirft die Aufnahme. Standalone-Export und Preview\n  verwenden dieselbe Recorder-Logik.\n- Der externe URL-Recorder ist eine Authoring-Grenze außerhalb von Runtime und Modell.\n  Er bedient eine kurzlebige isolierte Browser-Session für öffentliche `http`/`https`-URLs,\n  zeichnet Klick-, Eingabe-, Tasten-, Scroll- und Navigationsschritte mit Zeitabständen auf\n  und erzeugt nach jedem committed Schritt einen visuellen Snapshot.\n- Beim Abschluss wird die Aufnahme ausschließlich über den kanonischen MCP-Core in ein\n  normales Schema-2-Modell kompiliert. Jeder Snapshot ist ein normaler State; die\n  aufgezeichneten Zeitabstände werden als normale `timer`-Transitionen materialisiert.\n  Es gibt keine Recorder-Sonderfelder, keinen Shadow State und keine zweite FSM-Grammatik.\n- Das Recorder-Replay bedient die Originalseite deterministisch über aufgezeichnete\n  Selektoren mit Koordinaten-Fallback. Passwortwerte werden nie persistiert; benötigt ein\n  Replay ein solches Secret, stoppt es fail-closed. Private, lokale, Link-Local- und\n  Metadata-Ziele werden serverseitig abgewiesen.\n- Der Export enthält JSON vollständig self-contained und optional einen',
              "external recorder contract"
          )
          replace_once(
              "docs/state-contract.md",
              '- Der Server ist stateless Transport und besitzt weder Prozessmodell noch\n  Runtime-Bus.\n',
              '- Der Realtime-Server ist stateless Transport und besitzt weder Prozessmodell noch\n  Runtime-Bus. Der getrennte Recorder-Service besitzt ausschließlich kurzlebige\n  Authoring-Browser-Sessions; sie sind kein Modellbestandteil, verfallen automatisch und\n  dürfen den Runtime-Bus nicht beeinflussen.\n',
              "recorder server boundary"
          )

          api_path = Path("docs/realtime-api.md")
          api = api_path.read_text()
          if "## External URL Recorder" not in api:
              api += '''\n\n## External URL Recorder\n\nDie Recorder-Oberfläche liegt als statische Autorenoberfläche unter `/recorder.html`. Sie spricht ausschließlich mit dem getrennten Browser-Service auf `https://realtime.digitalisierungsplanung.de/recorder/sessions`. `POST /recorder/sessions` startet eine kurzlebige Session; `POST /recorder/sessions/:id/actions` führt `click`, `input`, `key`, `scroll` oder explizite Navigation aus; `POST /recorder/sessions/:id/finish` kompiliert die Aufnahme in eine kanonische State-Blueprint-Definition; `POST /recorder/sessions/:id/replay` spielt die Originalseite mit den aufgezeichneten Timings ab; `DELETE /recorder/sessions/:id` verwirft sie. Private Zielnetze und URL-Credentials sind verboten, Passwortwerte werden nicht gespeichert.\n'''
              api_path.write_text(api)

          # Core recorder tests now exercise the single static UI.
          test_path = Path("server/external-recorder.test.js")
          test_src = test_path.read_text()
          if 'const fs = require("node:fs");' not in test_src:
              test_src = test_src.replace('const assert = require("node:assert/strict");\n', 'const assert = require("node:assert/strict");\nconst fs = require("node:fs");\nconst path = require("node:path");\n')
          old_ui = '''test("recorder UI exposes external click, keyboard, scroll, finish, import and live replay controls", () => {\n  const html = recorder.recorderHtml();\n  assert.match(html, /Website aufnehmen/);\n  assert.match(html, /\\/recorder\\/sessions/);\n  assert.match(html, /STATE_BLUEPRINT_EXTERNAL_RECORDING_RESULT/);\n  assert.match(html, /Original-Website automatisch replayen/);\n  assert.match(html, /Passwortwerte werden nie gespeichert/);\n});'''
          new_ui = '''test("recorder UI exposes external click, keyboard, scroll, finish, import and live replay controls", () => {\n  const html = fs.readFileSync(path.join(__dirname, "..", "recorder.html"), "utf8");\n  assert.match(html, /Website aufnehmen/);\n  assert.match(html, /\\/recorder\\/sessions/);\n  assert.match(html, /stateBlueprintHotLinked\\.model\\.v2/);\n  assert.match(html, /Original-Website automatisch replayen/);\n  assert.match(html, /Passwortwerte werden nicht gespeichert/);\n});'''
          if old_ui not in test_src:
              raise SystemExit("missing external recorder UI test marker")
          test_path.write_text(test_src.replace(old_ui, new_ui, 1))

          integration_path = Path("server/external-recorder-integration.test.js")
          integration = integration_path.read_text()
          integration = integration.replace('  const host = read("disable-sw.js");', '  const host = read("state.html");')
          integration = integration.replace('  assert.match(host, /location\\.href = "\\/recorder\\.html"/);', '  assert.match(host, /location\\.href = "\\/recorder\\.html"/);\n  assert.doesNotMatch(read("disable-sw.js"), /btnRecordUrl/);')
          integration = integration.replace('  assert.match(deploy, /playwright@1\\.60\\.0/);\n  assert.match(deploy, /playwright install --with-deps chromium/);', '  assert.equal(require("../package.json").dependencies.playwright, "1.60.0");\n  assert.doesNotMatch(deploy, /npm install --no-save.*playwright/);\n  assert.match(deploy, /playwright install --with-deps chromium/);')
          integration_path.write_text(integration)

          # Remove abandoned extension prototype if any survived.
          ext = Path("external-recorder")
          if ext.exists(): shutil.rmtree(ext)
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Syntax and server contracts
        run: |
          node --check server/external-recorder.js
          node --check server/recorder-run.js
          npm run test:server
      - name: Browser smoke contract
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/core-contracts.spec.js --grep "APP_HTML string keeps nested script end tags escaped|generated self-contained app script stays syntactically valid" --reporter=line
      - name: Commit final product diff
        run: |
          rm -f .github/workflows/recorder-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize external URL recorder contract"
          git push
