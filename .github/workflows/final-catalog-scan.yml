name: Final catalog scan
on:
  push:
    branches:
      - fix/final-recorder-focused-catalog
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact inspector catalog sources
        shell: bash
        run: |
          set -euo pipefail
          echo '=== componentPresetTypes ==='
          sed -n '16088,16125p' state.html
          echo '=== component editor type select ==='
          sed -n '17460,17520p' state.html
          echo '=== builtinStateTemplates definition refs ==='
          grep -n 'function builtinStateTemplates\|const builtinStateTemplates\|builtinStateTemplates =' state.html || true
          LINE=$(grep -n 'function builtinStateTemplates' state.html | head -n1 | cut -d: -f1 || true)
          if [[ -n "$LINE" ]]; then START=$((LINE-5)); END=$((LINE+90)); sed -n "${START},${END}p" state.html; fi
          echo '=== widgetPresetInfo and hidden ==='
          grep -nE 'function widgetPresetInfo|hidden|legacy' state.html | head -n 180 || true
          echo '=== stale storage seeds ==='
          grep -nF 'localStorage.setItem(key, JSON.stringify(model));' tests/state-tool.spec.js | head -n 80 || true
