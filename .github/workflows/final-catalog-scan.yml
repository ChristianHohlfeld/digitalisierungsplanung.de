name: Final catalog scan
on:
  push:
    branches:
      - fix/final-recorder-focused-catalog
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact editor catalog and stale tests
        shell: bash
        run: |
          set -euo pipefail
          echo '=== COMPONENT PRESET FUNCTIONS ==='
          grep -nE 'function componentPresetTypes|componentPresetTypes\(|function .*Preset.*Template|pWidgetLibrary|Bausteinvorlage' state.html | head -n 120 || true
          echo '=== BAUSTEINE UI ==='
          sed -n '16140,16330p' state.html
          echo '=== PRESET TEMPLATE MAPPING ==='
          sed -n '22180,22370p' state.html
          echo '=== OLD WIDGET TESTS ==='
          sed -n '6100,6245p' tests/state-tool.spec.js
          sed -n '7040,7140p' tests/state-tool.spec.js
          echo '=== OLD BUILTIN IDS IN TESTS ==='
          grep -oE 'builtin_daisy_[a-z0-9_]+' tests/state-tool.spec.js | sort | uniq -c | sort -k2 || true
          echo '=== STALE STORAGE MODEL SEED COUNT ==='
          grep -cF 'localStorage.setItem(key, JSON.stringify(model));' tests/state-tool.spec.js || true
