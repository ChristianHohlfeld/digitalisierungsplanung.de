name: One-shot recorder source cut

on:
  push:
    branches:
      - fix/browser-extension-recorder-207

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-extension-recorder-207
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply clean browser-extension recorder cut
        run: |
          node --check scripts/apply-browser-extension-recorder.mjs
          node scripts/apply-browser-extension-recorder.mjs
          node --check recorder-extension/content.js
          node --check recorder-extension/background.js
          node --check recorder-extension/editor-bridge.js
          node --test server/browser-extension-recorder.test.js
      - name: Commit generated product source and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-recorder-cut.yml scripts/apply-browser-extension-recorder.mjs
          git add -A
          git commit -m "Use the real browser tab as recorder"
          git push origin HEAD:fix/browser-extension-recorder-207
