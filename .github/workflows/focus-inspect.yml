name: Focus inspect

on:
  push:
    branches:
      - focus/minimal-presets

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: focus/minimal-presets
      - name: Capture exact focused snippets
        shell: bash
        run: |
          set -euxo pipefail
          changed=0
          if [ ! -f .tmp-input-renderer.txt ]; then
            {
              echo '--- input / daisy renderer ---'
              grep -n -E -C 35 'inputType|variant[^\n]{0,80}input|input[^\n]{0,80}variant|case ["'"']input["'"']|daisy[^\n]{0,80}input|createElement\(["'"']input["'"']\)' state.html | head -n 1200 || true
            } > .tmp-input-renderer.txt
            changed=1
          fi
          if [ ! -f .tmp-state-title-editor.txt ]; then
            {
              echo '--- state title editor / mutations ---'
              grep -n -E -C 28 'titleInput|stateTitle|state-title|State title|State-Titel|Zustand.*Titel|Titel.*Zustand|\.title[[:space:]]*=|title:[[:space:]]*.*value|placeholder=.*Titel|value=.*\.title' state.html | head -n 1400 || true
              echo '--- selected inspector areas ---'
              grep -n -E -C 20 'selectedState|activeState|Inspector|Eigenschaften|properties|stateInspector' state.html | head -n 1000 || true
            } > .tmp-state-title-editor.txt
            changed=1
          fi
          if [ "$changed" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .tmp-input-renderer.txt .tmp-state-title-editor.txt
            git commit -m 'chore: capture exact renderer and title snippets'
            git push origin HEAD:focus/minimal-presets
          fi
