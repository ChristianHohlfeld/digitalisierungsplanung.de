name: Focus inspect

on:
  push:
    branches:
      - focus/minimal-presets

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message == 'chore: inspect focused preset integration points'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: focus/minimal-presets
      - name: Capture exact integration snippets
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo '--- input renderer candidates ---'
            grep -n -E -C 35 'variant.*input|input.*variant|inputType|type=.date.|createElement\(.input|<input|type=.email.|type=.password.|type=.search.|type=.number.' state.html | head -n 1800 || true
            echo '--- state title editor candidates ---'
            grep -n -E -C 25 'state\.title|\.title =|titleInput|stateTitle|State-Titel|Zustand.*Titel|Titel.*Zustand' state.html | tail -n 1800 || true
            echo '--- preset references in tests ---'
            grep -R -n -E -C 8 'builtin_daisy_|presetCatalog|preset catalog|presets|pricing|bi-kpi|accordion|navbar|hero|file-input|countdown' server/*.test.js tests/*.spec.js | head -n 2500 || true
          } > .tmp-focus-deep.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-focus-deep.txt
          git commit -m 'chore: capture focused integration snippets'
          git push origin HEAD:focus/minimal-presets
