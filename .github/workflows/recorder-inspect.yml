name: Integrate external recorder

on:
  push:
    branches:
      - feature/external-url-recorder

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch product integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing marker for {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once('server/server.js', 'const agentWidget = require("./agent-widget");', 'const agentWidget = require("./agent-widget");\nconst externalRecorder = require("./external-recorder");', 'external recorder require')
          replace_once('server/server.js', '  const rooms = new Map();', '  const rooms = new Map();\n  const recorderManager = options.recorderManager || externalRecorder.createRecorderManager(options.externalRecorder || {});', 'recorder manager')
          replace_once('server/server.js', '    const url = new URL(request.url || "/", "http://localhost");\n    if (request.method === "GET" && url.pathname === "/healthz") {', '    const url = new URL(request.url || "/", "http://localhost");\n    if (externalRecorder.matchesRecorderPath(url.pathname)) {\n      void externalRecorder.handleRecorderRequest(request, response, url, { manager: recorderManager, allowedOrigins: config.allowedOrigins, publicBaseUrl: publicBaseUrl(request) });\n      return;\n    }\n    if (request.method === "GET" && url.pathname === "/healthz") {', 'recorder route')
          replace_once('server/server.js', '  function close() {\n    clearInterval(heartbeat);\n    for (const socket of wss.clients) socket.terminate();\n    return new Promise(resolve => {\n      wss.close(() => {\n        if (!server.listening) {\n          resolve();\n          return;\n        }\n        server.close(() => resolve());\n      });\n    });\n  }', '  async function close() {\n    clearInterval(heartbeat);\n    for (const socket of wss.clients) socket.terminate();\n    await new Promise(resolve => {\n      wss.close(() => {\n        if (!server.listening) {\n          resolve();\n          return;\n        }\n        server.close(() => resolve());\n      });\n    });\n    await recorderManager.close?.();\n  }', 'recorder lifecycle')
          replace_once('server/server.js', '    wss,\n    rooms,\n    listen,', '    wss,\n    rooms,\n    recorderManager,\n    listen,', 'recorder return')

          replace_once('server/ecosystem.config.cjs', '        ZUSTAND_DEPLOY_COMMIT: process.env.ZUSTAND_DEPLOY_COMMIT || ""', '        ZUSTAND_DEPLOY_COMMIT: process.env.ZUSTAND_DEPLOY_COMMIT || "",\n        PLAYWRIGHT_BROWSERS_PATH: process.env.PLAYWRIGHT_BROWSERS_PATH || `${stateDir}/playwright`', 'playwright env')
          replace_once('server/deploy.sh', 'retry 3 5 npm ci --omit=dev\n', 'retry 3 5 npm ci --omit=dev\nexport PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-/var/lib/digitalisierungsplanung/playwright}"\ninstall -d -m 755 "$PLAYWRIGHT_BROWSERS_PATH"\nlog "Ensuring Chromium for external URL recorder."\nretry 2 5 npx playwright install --with-deps chromium\n', 'production browser install')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package.setdefault('dependencies', {})['playwright'] = '1.60.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          replace_once('state.html', '    <button id="btnLoad">Laden</button>\n    <button id="btnExport">HTML exportieren</button>', '    <button id="btnLoad">Laden</button>\n    <button id="btnRecordUrl" title="Beliebige Website durchklicken und als State-Ablauf übernehmen">URL aufnehmen</button>\n    <button id="btnExport">HTML exportieren</button>', 'recorder button')
          replace_once('state.html', '        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnLoad">Laden</button>\n        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnExport">HTML exportieren</button>', '        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnLoad">Laden</button>\n        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnRecordUrl">URL aufnehmen</button>\n        <button class="topbar-mobile-only" type="button" data-topbar-proxy="btnExport">HTML exportieren</button>', 'recorder mobile button')
          listener_marker = '    window.addEventListener("message", evt => {\n      const data = evt.data || {};\n      if (!hostAcceptsRuntimeMessage(evt, data)) return;'
          listener_insert = '''    const EXTERNAL_RECORDER_ORIGIN = "https://realtime.digitalisierungsplanung.de";
    let externalRecorderWindow = null;
    function openExternalUrlRecorder() {
      const recorderUrl = EXTERNAL_RECORDER_ORIGIN + "/recorder.html?targetOrigin=" + encodeURIComponent(location.origin);
      try {
        externalRecorderWindow = window.open(recorderUrl, "zustand-external-recorder", "popup,width=1220,height=900,resizable=yes,scrollbars=yes");
        if (externalRecorderWindow) { try { externalRecorderWindow.focus(); } catch (_) {} return true; }
      } catch (_) {}
      modalAlert("Der Browser hat das Recorder-Fenster blockiert. Bitte Pop-ups für diese Seite erlauben.", "Recorder blockiert");
      return false;
    }
    window.addEventListener("message", evt => {
      if (evt.origin !== EXTERNAL_RECORDER_ORIGIN || evt.source !== externalRecorderWindow) return;
      const data = evt.data || {};
      if (data.type !== "STATE_BLUEPRINT_EXTERNAL_RECORDING_RESULT") return;
      try {
        const definition = data.definition;
        if (!definition || definition.kind !== DEFINITION_KIND || definition.schemaVersion !== DEFINITION_SCHEMA_VERSION || definition.app !== "Zustand") throw new Error("Recorder returned an invalid State Blueprint definition.");
        if (!Array.isArray(definition.stateTemplates) || definition.stateTemplates.length) throw new Error("Recorder definition must not contain local state templates.");
        loadEditorModel(validateModelDefinition(definition.model), true);
        try { externalRecorderWindow.close(); } catch (_) {}
        externalRecorderWindow = null;
      } catch (err) {
        modalAlert(err?.message || "Die Website-Aufnahme konnte nicht übernommen werden.", "Recorder-Import fehlgeschlagen");
      }
    });

'''
          state = Path('state.html').read_text()
          if listener_insert not in state:
              if listener_marker not in state: raise SystemExit('missing runtime message listener')
              Path('state.html').write_text(state.replace(listener_marker, listener_insert + listener_marker, 1))
          replace_once('state.html', '    document.getElementById("btnLoad").onclick = requestLoadBlueprintFile;\n    document.getElementById("btnExport").onclick = exportHtmlFile;', '    document.getElementById("btnLoad").onclick = requestLoadBlueprintFile;\n    document.getElementById("btnRecordUrl").onclick = openExternalUrlRecorder;\n    document.getElementById("btnExport").onclick = exportHtmlFile;', 'recorder binding')

          replace_once('docs/state-contract.md', '- Reset oder neues Modell verwirft die Aufnahme. Standalone-Export und Preview\n  verwenden dieselbe Recorder-Logik.\n', '- Reset oder neues Modell verwirft die Aufnahme. Standalone-Export und Preview\n  verwenden dieselbe Recorder-Logik.\n- Der externe URL-Recorder ist eine Authoring-Grenze außerhalb des Modells. Er bedient eine\n  kurzlebige isolierte Browser-Session, erfasst Klick-, Eingabe-, Tasten-, Scroll- und\n  Navigationsfolgen samt Zeitabständen und kompiliert den Abschluss über den kanonischen\n  MCP-Core in normale Schema-2-States und Transitionen. Timings werden als normale\n  `timer`-Transitionen materialisiert; es gibt keinen Recorder-Shadow-State. Passwortwerte\n  werden nicht persistiert und private/lokale Zielnetze werden fail-closed abgewiesen.\n', 'recorder contract')

          for path in [Path('external-recorder'), Path('.tmp-recorder-host.txt'), Path('.tmp-recorder-inspect.txt'), Path('.tmp-recorder-server.txt'), Path('.tmp-recorder-state.txt')]:
              if path.is_dir(): shutil.rmtree(path)
              elif path.exists(): path.unlink()
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Syntax checks
        run: node --check server/external-recorder.js && node --check server/server.js
      - name: Server contracts
        run: npm run test:server
      - name: Focused browser contracts
        run: npx playwright test tests/core-contracts.spec.js --grep "APP_HTML string keeps nested script end tags escaped|generated self-contained app script stays syntactically valid" --reporter=line
      - name: Commit integrated recorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate external URL recorder" || exit 0
          git push
