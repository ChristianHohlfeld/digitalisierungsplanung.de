name: Recorder inspect

on:
  push:
    branches:
      - feature/external-url-recorder

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract recorder source context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('state.html').read_text()
          terms = [r'record', r'replay', r'gif']
          out=[]
          seen=[]
          for term in terms:
              for m in re.finditer(term, src, re.I):
                  pos=m.start()
                  if any(abs(pos-p)<700 for p in seen):
                      continue
                  seen.append(pos)
                  a=max(0,pos-900); b=min(len(src),pos+1800)
                  out.append(f'\n===== {term} @ {pos} =====\n'+src[a:b])
          Path('.tmp-recorder-inspect.txt').write_text('\n'.join(out[:120]))
          PY
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-recorder-inspect.txt
          git commit -m "chore: inspect recorder source" || exit 0
          git push
