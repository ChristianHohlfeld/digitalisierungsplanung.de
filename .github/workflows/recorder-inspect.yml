name: Recorder inspect

on:
  push:
    branches:
      - feature/external-url-recorder

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract canonical model shapes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const core = require('./mcp/state-blueprint-core');
          const sample = {
            version: 2,
            name: 'Recorded flow',
            initial: 'step_1',
            states: [
              { id: 'step_1', title: 'Click Login', components: [{ id: 'c1', type: 'text', text: 'Click #login', url: '' }], data: { action: 'click', url: 'https://example.com/', selector: '#login', delayMs: 350 }, dataTypes: { action: 'text', url: 'text', selector: 'text', delayMs: 'number' }, x: 120, y: 120 },
              { id: 'wait_1', title: 'Wait 350 ms', components: [{ id: 'c2', type: 'note', text: 'Recorded delay: 350 ms', url: '' }], x: 360, y: 120 },
              { id: 'step_2', title: 'Navigate', components: [{ id: 'c3', type: 'text', text: 'Navigate', url: '' }], x: 600, y: 120 }
            ],
            transitions: [
              { id: 't_1_wait', from: 'step_1', to: 'wait_1', label: 'Click Login', condition: '', triggerType: 'auto', triggerEvent: '', timerMs: 0, set: {} },
              { id: 't_1_next', from: 'wait_1', to: 'step_2', label: '350 ms', condition: '', triggerType: 'timer', triggerEvent: '', timerMs: 350, set: {} }
            ]
          };
          const normalized = core.normalizeModel(sample);
          const validation = core.validateModel(sample);
          const definition = core.definitionPayload(sample, [], {});
          fs.writeFileSync('.tmp-model-shape.json', JSON.stringify({ blank: core.blankModel(), normalized, validation: { ok: validation.ok, issues: validation.issues, model: validation.model }, definition }, null, 2));
          NODE
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-model-shape.json
          git commit -m "chore: inspect canonical recorder model" || exit 0
          git push
