name: External recorder CI

on:
  push:
    branches:
      - feature/external-url-recorder
  pull_request:
    branches:
      - main

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: External recorder syntax
        run: node --check server/external-recorder.js && node --check external-recorder/compiler.js
      - name: Server tests
        run: npm run test:server
