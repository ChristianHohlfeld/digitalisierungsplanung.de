name: Recorder inspect

on:
  push:
    branches:
      - feature/external-url-recorder

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract host-only integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('state.html').read_text()
          host=re.sub(r'const APP_HTML = "(?:\\.|[^"\\])*";', 'const APP_HTML = "";', src, count=1)
          terms=[r'addEventListener\(["\']message',r'postRuntimePayload',r'STATE_BLUEPRINT_RUNTIME_STATE',r'definition',r'import',r'normalizeModel',r'function save',r'function persist',r'localStorage\.setItem',r'model\s*=']
          out=[];seen=[]
          for term in terms:
            for m in re.finditer(term,host,re.I):
              p=m.start()
              if any(abs(p-q)<1200 for q in seen): continue
              seen.append(p)
              out.append(f'\n===== {term} @ {p} =====\n'+host[max(0,p-1800):min(len(host),p+4200)])
          Path('.tmp-recorder-host.txt').write_text('\n'.join(out[:120]))
          PY
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-recorder-host.txt
          git commit -m "chore: inspect recorder host integration" || exit 0
          git push
